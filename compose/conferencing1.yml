# DVRTC conferencing1 scenario - WebRTC Conferencing Platform 1

x-logging:
  &default-logging
  options:
    max-size: '12m'
    max-file: '5'
  driver: local

x-required-public-ipv4:
  &required-public-ipv4
  PUBLIC_IPV4: "${PUBLIC_IPV4:?DVRTC setup incomplete: run ./scripts/setup_networking.sh and ./scripts/init-selfsigned.sh before starting a scenario with './scripts/compose.sh --scenario conferencing1 up -d'. See README.md Initial Setup.}"

services:
  # Conferencing frontend - tenant-aware web UI, API, and Janus WebSocket proxy
  conferencing-frontend:
    image: ghcr.io/enablesecurity/dvrtc/conferencing1-frontend:v0.3.0-wip.20260605
    platform: linux/amd64
    logging: *default-logging
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      janus:
        condition: service_healthy
    environment:
      FRONTEND_PORT: "${CONFERENCING1_FRONTEND_PORT:-80}"
      FRONTEND_HTTPS_PORT: "${CONFERENCING1_FRONTEND_HTTPS_PORT:-443}"
      FRONTEND_TLS_RELOAD_INTERVAL_MS: "${FRONTEND_TLS_RELOAD_INTERVAL_MS:-60000}"
      JANUS_WS_PORT: "${JANUS_WS_PORT:-8188}"
      FRONTEND_MAX_MEETINGS: "${FRONTEND_MAX_MEETINGS:-500}"
      FRONTEND_MEETING_TTL_MS: "${FRONTEND_MEETING_TTL_MS:-14400000}"
      FRONTEND_EMPTY_ROOM_TTL_MS: "${FRONTEND_EMPTY_ROOM_TTL_MS:-60000}"
      FRONTEND_MEETING_CLEANUP_BATCH_SIZE: "${FRONTEND_MEETING_CLEANUP_BATCH_SIZE:-20}"
      FRONTEND_MEETING_CLEANUP_SCAN_LIMIT: "${FRONTEND_MEETING_CLEANUP_SCAN_LIMIT:-100}"
      FRONTEND_APP_ROOM_MIN: "${FRONTEND_APP_ROOM_MIN:-800000}"
      FRONTEND_APP_ROOM_MAX: "${FRONTEND_APP_ROOM_MAX:-899999}"
    volumes:
      - type: volume
        source: acme-challenge
        target: /opt/dvrtc-conferencing-frontend/app/public/.well-known/acme-challenge
        read_only: true
      - type: bind
        source: ./data/certs
        target: /etc/certstore
        read_only: true
    healthcheck:
      test: ["CMD", "conferencing-frontend-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Janus - WebRTC server for the conferencing1 scenario
  janus:
    image: ghcr.io/enablesecurity/dvrtc/conferencing1-janus:v0.3.0-wip.20260605
    platform: linux/amd64
    logging: *default-logging
    restart: unless-stopped
    network_mode: "host"
    environment:
      <<: *required-public-ipv4
      PUBLIC_IPV6: "${PUBLIC_IPV6:-}"
      JANUS_HTTP_PORT: "${JANUS_HTTP_PORT:-8088}"
      JANUS_WS_PORT: "${JANUS_WS_PORT:-8188}"
      JANUS_RTP_PORT_RANGE: "${JANUS_RTP_PORT_RANGE:-40001-45000}"
      JANUS_DEBUG_LEVEL: "${JANUS_DEBUG_LEVEL:-4}"
      JANUS_NAT_1_1_IP: "${JANUS_NAT_1_1_IP:-}"
    healthcheck:
      test: ["CMD", "janus-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # bluepill-bots - lightweight aiortc pair occupying a BluePill Meeting room
  # with looping Matrix-themed audio and generated video.
  bluepill-bots:
    image: ghcr.io/enablesecurity/dvrtc/conferencing1-bluepill-aiortc-bots:v0.3.0-wip.20260605
    platform: linux/amd64
    logging: *default-logging
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      conferencing-frontend:
        condition: service_healthy
      janus:
        condition: service_healthy
    environment:
      BOT_FRONTEND_URL: "${BOT_FRONTEND_URL:-http://127.0.0.1:${CONFERENCING1_FRONTEND_PORT:-80}}"
      BOT_PUBLIC_URL: "${BOT_PUBLIC_URL:-https://${PUBLIC_IPV4}}"
      BOT_JOIN_TIMEOUT_MS: "${BOT_JOIN_TIMEOUT_MS:-30000}"
      BOT_HEALTH_INTERVAL_MS: "${BOT_HEALTH_INTERVAL_MS:-15000}"
      BOT_RESTART_BACKOFF_MS: "${BOT_RESTART_BACKOFF_MS:-10000}"
      BOT_CLEANUP_RETRIES: "${BOT_CLEANUP_RETRIES:-5}"
      BOT_CLEANUP_RETRY_DELAY_MS: "${BOT_CLEANUP_RETRY_DELAY_MS:-1000}"
      BOT_AIORTC_VIDEO_WIDTH: "${BOT_AIORTC_VIDEO_WIDTH:-160}"
      BOT_AIORTC_VIDEO_HEIGHT: "${BOT_AIORTC_VIDEO_HEIGHT:-120}"
      BOT_AIORTC_VIDEO_FPS: "${BOT_AIORTC_VIDEO_FPS:-30}"
    healthcheck:
      test: ["CMD", "bluepill-bots-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Certbot - LetsEncrypt certificate renewal for the conferencing frontend
  certbot:
    logging: *default-logging
    restart: unless-stopped
    image: certbot/certbot:v5.4.0
    depends_on:
      conferencing-frontend:
        condition: service_healthy
    volumes:
      - type: volume
        source: acme-challenge
        target: /var/www/html/.well-known/acme-challenge
      - type: bind
        source: ./data/certs
        target: /etc/certstore
    environment:
      - EMAIL
      - DOMAIN
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        if [ -z "$$DOMAIN" ]; then
          echo "No domain specified, certbot will not run"
          sleep infinity
        fi
        while :; do
          certbot certonly -n -d "$$DOMAIN" --agree-tos --webroot -w /var/www/html --email "$$EMAIL" \
            --deploy-hook 'sh -c '\''owner=$(stat -c %u:%g /etc/certstore) && cp /etc/letsencrypt/live/$$DOMAIN/* /etc/certstore && chown $$owner /etc/certstore/* && chmod 644 /etc/certstore/fullchain.pem /etc/certstore/privkey.pem'\'''
          sleep 12h & wait $${!}
        done

  # Scenario-specific attacker console certificates for one-off HTTPS serving
  attacker:
    volumes:
      - type: bind
        source: ./data/certs
        target: /etc/certstore
        read_only: true
